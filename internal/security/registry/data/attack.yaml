# MITRE ATT&CK techniques and mitigations the registry's finding definitions
# reference.
#
# MITRE's license for this content requires that any copy reproduce MITRE's
# copyright designation and the license. That notice is in
# internal/notices/THIRD_PARTY_NOTICES.md, is embedded in the binary, and is
# printed by owatch notices.
#
# Each entry was read from its page on attack.mitre.org on 2026-11-15, and
# T1040, T1552.001 and T1557 with M1030 and M1031 on 2026-11-19, where
# the site's current release is ATT&CK v20.1 (13 October 2026). The id, name
# and tactics of a technique, and the mitigations its page lists, are as the
# page gives them; the name of each mitigation was cross-checked against the
# site's mitigations index. A technique with no definition referencing it, a
# mitigation no technique lists, or a definition naming an id absent here,
# stops the registry from loading.
#
# A technique is attached to a finding where the technique's page, or the
# finding's own impact text, names the host condition the finding reports. It
# says what an adversary can do because of that condition. It does not say the
# adversary has done it.
#
# T1685 and T1686 are the current techniques for disabling security tools and
# system firewalls. The D3FEND knowledge base, which MITRE publishes, marks
# the earlier T1562.001 and T1562.004 as revoked in their favor.

version: "v20.1"

mitigations:
