# Windows finding definitions for the orkowatch registry.
# Each cvss_vector is the CVSS v4.0 baseline of the condition, scored by FIRST's algorithm,
# and each cvss_score is the one its vector computes. Severity tiers follow the score
# ranges of the specification's Table 22. The registry refuses to load a definition where
# the severity, the score and the vector disagree:
#   CRITICAL 9.0-10.0 | HIGH 7.0-8.9 | MEDIUM 4.0-6.9 | LOW 0.1-3.9
# A NIST reference names only the control: its title and release come from the
# bundled catalog (nist.yaml), which load checks it against. Any other reference
# states its source, the edition checked and the date it was verified (see
# registry.ReferenceSpec); one with no verified date has not been checked and is
# withheld from every report. The weakness a definition maps to is its cwe field,
# and its reference is built from that.

# -------------------------
# SSH checker findings
# -------------------------

ssh.server_not_running:
  title: "OpenSSH Server installed but not running"
  severity: "MEDIUM"
  cvss_score: 4.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N"
  records:
    service: [status]
  no_weakness: "CWE-16 is an obsolete grouping that MITRE prohibits for mapping, and no entry describes an installed service that is not running."
  description: >
    The OpenSSH Server (sshd) service is installed but currently stopped.
    An installed but inactive SSH daemon represents an unmanaged attack
    surface that any administrator-level process or user can start without
    additional installation steps.
  impact: >
    If started, an unconfigured or default-configured SSH service may permit
    password authentication or expose the system to brute-force attacks.
    Presence alone indicates unreviewed remote access capability.
  resolution: >
    If SSH is not required, remove the OpenSSH Server optional feature via
    Settings > Apps > Optional Features. If required, configure
    C:\ProgramData\ssh\sshd_config before enabling the service and restrict
    access via Windows Firewall rules.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "18.10.56"
    - source: NIST
      id: "CM-7"

ssh.config_not_found:
  title: "OpenSSH configuration file not found"
  severity: "MEDIUM"
  cvss_score: 4.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:L/SC:N/SI:N/SA:N"
  records:
    file: []
  no_weakness: "CWE-16 is an obsolete grouping that MITRE prohibits for mapping, and no entry describes a missing configuration file."
  description: >
    No sshd_config file was found at C:\ProgramData\ssh\sshd_config.
    Without an explicit configuration file, sshd falls back to compiled-in
    defaults which may permit password authentication and use deprecated
    algorithms.
  impact: >
    Default SSH configurations frequently fail CIS and DISA STIG requirements.
    An attacker who starts the SSH service inherits permissive defaults,
    potentially enabling credential-based remote access without restriction.
  resolution: >
    Create C:\ProgramData\ssh\sshd_config with explicit directives for
    PasswordAuthentication, PermitRootLogin, and AllowedUsers before
    enabling the sshd service.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "18.10.56.2"
    - source: NIST
      id: "CM-6"
    - source: URL
      title: "Microsoft Learn: OpenSSH Server Configuration for Windows"
      url: "https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh-server-configuration"
      version: "page updated 2025-08-05"
      verified: "2026-11-15"

ssh.root_login_permitted:
  title: "SSH PermitRootLogin is not explicitly disabled"
  severity: "CRITICAL"
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    sshd-directive: [value, match]
  cwe: "CWE-250"
  attack_techniques:
    - id: "T1021.004"
      basis:
        - "NIST AC-6 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST IA-2 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    The SSH configuration does not explicitly set PermitRootLogin to no.
    Direct privileged login over SSH gives an attacker full system control
    upon credential compromise with no privilege escalation step required.
  impact: >
    A successful brute-force or credential stuffing attack against the root
    or Administrator account yields immediate full control of the host.
    No additional exploitation step is required post-authentication.
  resolution: >
    Set PermitRootLogin no in C:\ProgramData\ssh\sshd_config and restart
    the sshd service. Administrative access should require key-based
    authentication to a non-privileged account followed by explicit
    privilege escalation.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "18.10.56.3"
    - source: NIST
      id: "AC-6"
    - source: NIST
      id: "IA-2"
    - source: URL
      title: "Microsoft Learn: OpenSSH Server Configuration for Windows"
      url: "https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh-server-configuration"
      version: "page updated 2025-08-05"
      verified: "2026-11-15"

ssh.password_auth_enabled:
  title: "SSH password authentication is enabled"
  severity: "HIGH"
  cvss_score: 8.7
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  records:
    sshd-directive: [value, match]
  cwe: "CWE-521"
  attack_techniques:
    - id: "T1021.004"
      basis:
        - "NIST IA-5(1) maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-521 relates to CAPEC-555, which CAPEC 3.9 maps to its parent technique T1021"
    - id: "T1110.001"
      basis:
        - "NIST IA-5(1) maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-521 relates to CAPEC-49, which CAPEC 3.9 maps to this technique"
  description: >
    PasswordAuthentication is set to yes in the SSH configuration.
    Password-based SSH is susceptible to brute-force and credential
    stuffing attacks, particularly when accounts have weak or reused
    passwords.
  impact: >
    Any network-accessible SSH service with password authentication enabled
    can be targeted by automated brute-force tools. Credential exposure
    from unrelated breaches directly translates to SSH access risk.
  resolution: >
    Set PasswordAuthentication no in C:\ProgramData\ssh\sshd_config and
    configure key-based authentication exclusively. Restart the sshd
    service after making changes.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "18.10.56"
    - source: NIST
      id: "IA-5(1)"

# -------------------------
# Firewall checker findings
# -------------------------

firewall.profile_inactive:
  title: "One or more Windows Firewall profiles are inactive"
  severity: "CRITICAL"
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  records:
    firewall-profile: [state]
  cwe: "CWE-923"
  attack_techniques:
    - id: "T1686"
      basis:
        - "NIST CM-6 maps to this technique, listed there as T1562.004 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    One or more Windows Firewall profiles (Domain, Private, or Public) are
    not active. A disabled firewall profile removes the host-based packet
    filter for that network category, exposing all listening services to
    unauthenticated network traffic matching that profile.
  impact: >
    All services bound to network interfaces governed by the inactive profile
    become directly reachable without firewall enforcement. This eliminates
    a critical defense-in-depth layer against lateral movement and remote
    exploitation.
  resolution: >
    Enable all firewall profiles via: netsh advfirewall set allprofiles
    state on. Verify profile state with: netsh advfirewall show allprofiles.
    Ensure profiles remain enabled via Group Policy if the system is
    domain-joined.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "9.1.1, §9.2.1, §9.3.1"
    - source: NIST
      id: "SC-7"
    - source: NIST
      id: "CM-6"

firewall.all_profiles_disabled:
  title: "Windows Firewall is completely disabled on all profiles"
  severity: "CRITICAL"
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    firewall-profile: [state]
  cwe: "CWE-923"
  attack_techniques:
    - id: "T1686"
      basis:
        - "NIST CM-6 maps to this technique, listed there as T1562.004 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    Windows Defender Firewall is disabled across all profiles — Domain,
    Private, and Public. The host has no active host-based packet filtering
    on any network interface. This is the highest-risk firewall
    misconfiguration possible on a Windows host.
  impact: >
    Every listening service on every interface is reachable without
    restriction. Combined with any other vulnerability, this eliminates
    network-layer mitigation entirely. Lateral movement, exploitation of
    unpatched services, and data exfiltration face no host-based network
    controls.
  resolution: >
    Immediately enable all firewall profiles: netsh advfirewall set
    allprofiles state on. Investigate how the firewall was disabled and
    whether unauthorized access occurred during the period it was inactive.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "9.1.1, §9.2.1, §9.3.1"
    - source: NIST
      id: "SC-7"
    - source: NIST
      id: "CM-6"

# -------------------------
# User checker findings
# -------------------------

users.no_password_required:
  title: "Active account is permitted to have a blank password"
  severity: "HIGH"
  cvss_score: 8.6
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    account: [sid, password_required, internet_identity]
  cwe: "CWE-521"
  attack_techniques:
    - id: "T1078.003"
      basis:
        - "NIST IA-5 maps to its parent technique T1078 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST IA-2 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    One or more enabled local accounts carry the account flag that exempts
    them from the password requirement. The flag permits a blank password;
    it does not show that the password is blank, and the stored credential
    cannot be read to tell. An account Windows records as connected to a
    Microsoft identity is reported separately and is not counted here.
  impact: >
    If the password is blank, anyone at the console or holding another
    local session can sign in as the account with no credential. The
    exemption also lets a blank password be set later whatever minimum
    length the password policy demands.
  resolution: >
    Clear the exemption with: net user <username> /passwordreq:yes. Then
    set a password that meets policy with: net user <username> *.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "1.1"
    - source: NIST
      id: "IA-5"
    - source: NIST
      id: "IA-2"

# CIS citation pending for the two policy definitions below: #144.
users.password_min_length_zero:
  title: "Password policy sets no minimum password length"
  severity: "MEDIUM"
  cvss_score: 6.9
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N"
  records:
    setting: [value]
  cwe: "CWE-521"
  attack_techniques:
    - id: "T1110.001"
      basis:
        - "NIST IA-5 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-521 relates to CAPEC-49, which CAPEC 3.9 maps to this technique"
  description: >
    The local password policy has a minimum password length of zero, so
    Windows accepts a password of any length, including an empty one, when
    an account password is set or changed.
  impact: >
    Accounts on this host can be given trivially short or blank passwords
    without the policy objecting, which leaves authenticator strength to
    each user's choice.
  resolution: >
    Set a minimum length in Local Security Policy > Account Policies >
    Password Policy, or with: net accounts /minpwlen:<length>.
  references:
    - source: NIST
      id: "IA-5"

users.lockout_threshold_disabled:
  title: "Account lockout is disabled"
  severity: "MEDIUM"
  cvss_score: 6.9
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N"
  records:
    setting: [value]
  cwe: "CWE-307"
  attack_techniques:
    - id: "T1110.001"
      basis:
        - "NIST AC-7 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-307 relates to CAPEC-49, which CAPEC 3.9 maps to this technique"
  description: >
    The local lockout policy has a threshold of zero, so no number of
    consecutive failed logon attempts locks an account.
  impact: >
    Passwords for local accounts can be guessed without limit, at the
    console or over any service that authenticates against them.
  resolution: >
    Set a lockout threshold in Local Security Policy > Account Policies >
    Account Lockout Policy, or with: net accounts /lockoutthreshold:<count>.
  references:
    - source: NIST
      id: "AC-7"

users.administrator_account_active:
  title: "User account has local Administrator privileges"
  severity: "HIGH"
  cvss_score: 8.4
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  records:
    account: [sid, password_required, internet_identity]
  cwe: "CWE-266"
  description: >
    One or more user accounts are members of the local Administrators group.
    Administrator-level accounts have unrestricted access to the local
    system and can bypass most security controls including UAC when
    configured to auto-elevate.
  impact: >
    Compromise of an Administrator account yields full local system control.
    Combined with credential reuse or weak passwords, Administrator group
    membership significantly increases the blast radius of any account
    compromise.
  resolution: >
    Limit the local Administrators group to accounts that explicitly require
    administrative access. Standard users should operate under least-privilege
    accounts. Review group membership regularly via: Get-LocalGroupMember
    -Group Administrators.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "2.2"
    - source: NIST
      id: "AC-6"

users.uac_disabled:
  title: "User Account Control (UAC) is disabled"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    setting: [value]
  cwe: "CWE-250"
  attack_techniques:
    - id: "T1548.002"
      basis:
        - "NIST AC-6 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    User Account Control is disabled via the EnableLUA registry key being
    set to 0. UAC is the primary privilege escalation barrier on Windows.
    Without it, any process running in the context of a local Administrator
    account inherits full administrative rights without a consent prompt.
  impact: >
    Malware, scripts, or any process running as the logged-in administrator
    gains unrestricted system access without triggering UAC elevation prompts.
    This eliminates the integrity level separation that UAC enforces and
    allows privilege escalation without any user interaction.
  resolution: >
    Enable UAC by setting HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\
    Policies\System\EnableLUA to 1, or via Local Security Policy >
    Security Options > User Account Control: Run all administrators in
    Admin Approval Mode. A system restart is required.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "2.3.17"
    - source: NIST
      id: "AC-6"

users.microsoft_account_no_local_password:
  title: "Microsoft-linked account has no local password hash"
  severity: "NONE"
  result: "notapplicable"
  cvss_score: 0.0
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:N/SC:N/SI:N/SA:N"
  records:
    account: [sid, password_required, internet_identity]
  description: >
    One or more accounts are linked to a Microsoft identity (personal
    Microsoft account) and carry no local password hash. Authentication
    is delegated to the Microsoft identity platform. This is expected
    behavior for Microsoft-linked accounts and does not indicate a
    missing credential -- the account cannot be authenticated locally
    without the associated Microsoft identity.
  impact: >
    Authentication posture for these accounts depends entirely on the
    Microsoft account security configuration (MFA, password strength,
    account recovery options). Local audit tooling cannot assess
    the external identity provider's controls. Compromise of the linked
    Microsoft account grants local access.
  resolution: >
    Ensure the linked Microsoft account has multi-factor authentication
    enabled and a strong password via account.microsoft.com/security.
    Review whether Microsoft-linked accounts are appropriate for this
    system's threat model. Consider using local accounts for systems
    that require fully auditable, offline-capable authentication.
  references:
    - source: NIST
      id: "IA-2"
    - source: NIST
      id: "IA-8"
    - source: URL
      title: "Microsoft Learn: USER_INFO_24 structure (lmaccess.h)"
      url: "https://learn.microsoft.com/en-us/windows/win32/api/lmaccess/ns-lmaccess-user_info_24"
      version: "page updated 2024-02-22"
      verified: "2026-11-15"

# Consumer: #144. No checker emits this definition: the local account
# database does not hold this kind of principal.
users.azure_ad_account_no_local_password:
  title: "Azure AD account has no local password hash"
  severity: "NONE"
  result: "notapplicable"
  cvss_score: 0.0
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:N/SC:N/SI:N/SA:N"
  records: {}
  description: >
    One or more accounts are joined via Azure Active Directory (Entra ID)
    and carry no local password hash. Authentication is managed by the
    organization's Azure AD tenant. This is expected behavior for
    Entra ID-joined accounts -- local credential enforcement does not
    apply because the identity provider is the authoritative source.
  impact: >
    Authentication posture depends on the organization's Azure AD
    tenant configuration including conditional access policies, MFA
    enforcement, and account lockout settings. These controls are
    outside the scope of local host auditing. Compromise of the Azure
    AD account or tenant grants local access.
  resolution: >
    Verify that the Azure AD tenant enforces MFA via Conditional Access
    and that account lockout policies meet organizational requirements.
    Confirm that Azure AD-joined accounts are appropriate for this
    system's classification and data handling requirements.
  references:
    - source: NIST
      id: "IA-2"
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "1.1"

# Consumer: #144. No checker emits this definition: the local account
# database does not hold this kind of principal.
users.domain_account_no_local_password:
  title: "Active Directory domain account has no local password hash"
  severity: "NONE"
  result: "notapplicable"
  cvss_score: 0.0
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:N/SC:N/SI:N/SA:N"
  records: {}
  description: >
    One or more accounts are sourced from an Active Directory domain
    and carry no local password hash. Authentication is handled by the
    domain controller via Kerberos or NTLM. This is expected behavior
    for domain accounts present in the local user list -- local password
    enforcement does not apply.
  impact: >
    Authentication posture depends on the domain's password policy,
    Kerberos configuration, and account lockout settings enforced by
    the domain controller. These are outside local audit scope. Domain
    credential compromise or pass-the-hash attacks against NTLM
    authentication remain valid attack paths independent of local
    password policy.
  resolution: >
    Ensure the domain enforces a strong password policy and account
    lockout via Group Policy. Evaluate whether NTLM should be restricted
    in favor of Kerberos-only authentication for sensitive systems.
    Review domain accounts present on this host and remove any that
    are not operationally required.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "1.1"
    - source: NIST
      id: "IA-2"
    - source: NIST
      id: "SC-8"

# Consumer: #144. No checker emits this definition: the local account
# database does not hold this kind of principal.
users.unknown_principal_no_local_password:
  title: "Account with undetermined principal source has no local password hash"
  severity: "MEDIUM"
  cvss_score: 6.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  records: {}
  no_weakness: "The principal's source could not be determined; no CWE entry describes that, and CWE-287 is discouraged by MITRE."
  description: >
    One or more accounts report an Unknown PrincipalSource from
    Get-LocalUser and carry no local password hash. The authentication
    mechanism for these accounts cannot be determined from available
    non-elevated information. This may indicate a SAM database anomaly,
    a pre-Windows 10 1607 account remnant, or an account in an
    indeterminate state.
  impact: >
    Without a confirmed authentication mechanism and no local credential
    present, it is not possible to determine what controls govern access
    to these accounts. An account in this state may be accessible
    without any credential depending on how Windows resolves the
    unknown source at logon time.
  resolution: >
    Investigate each affected account manually: Get-LocalUser -Name
    <username> | Select-Object *. Determine whether the account is
    still required. If the account cannot be attributed to a known
    identity source, disable or remove it. If required, establish a
    clear authentication mechanism and enforce a password or federated
    identity linkage.
  references:
    - source: NIST
      id: "IA-2"
    - source: NIST
      id: "IA-4"

# -------------------------
# Permissions checker findings
# -------------------------

permissions.everyone_full_control:
  title: "Everyone group has full control on a system path"
  severity: "CRITICAL"
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    acl-entry: [principal, sid, access, scope]
  cwe: "CWE-732"
  attack_techniques:
    - id: "T1574.010"
      basis:
        - "NIST AC-3 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-732 relates to CAPEC-1, CAPEC-17, CAPEC-180, which CAPEC 3.9 maps to this technique"
  description: >
    The Everyone group has been granted Full Control (F) on a critical
    system directory. This grants unrestricted read, write, execute, and
    delete permissions to all users including unauthenticated network
    users on some configurations.
  impact: >
    Any local or network user can replace, modify, or delete files in the
    affected directory. On system directories such as System32 or Program
    Files, this enables DLL planting, binary replacement, and direct
    privilege escalation without any exploit required.
  resolution: >
    Remove the Everyone group permission immediately using icacls:
    icacls <path> /remove "Everyone". Restore expected ACLs using icacls
    <path> /reset for system directories. Investigate how this permission
    was granted.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "2.2"
    - source: NIST
      id: "AC-3"

permissions.users_full_control:
  title: "Users group has full control on a system path"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    acl-entry: [principal, sid, access, scope]
  cwe: "CWE-732"
  attack_techniques:
    - id: "T1574.010"
      basis:
        - "NIST AC-3 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-732 relates to CAPEC-1, CAPEC-17, CAPEC-180, which CAPEC 3.9 maps to this technique"
  description: >
    The BUILTIN\Users group has been granted Full Control (F) on a critical
    system directory. Any authenticated local user can read, write, execute,
    and delete files in this location.
  impact: >
    Any standard user account can replace binaries or plant DLLs in the
    affected system directory, enabling privilege escalation without
    exploiting any software vulnerability. This is a common DLL hijacking
    precondition.
  resolution: >
    Remove the Full Control grant for BUILTIN\Users and restore read-execute
    permissions only: icacls <path> /remove:g "BUILTIN\Users" then
    icacls <path> /grant "BUILTIN\Users:(RX)". Verify against expected
    Windows ACL baselines.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "2.2"
    - source: NIST
      id: "AC-3"

# CIS citation pending for the two access control definitions below: #144.
permissions.broad_group_write_access:
  title: "A broad group can change a path"
  severity: "MEDIUM"
  cvss_score: 4.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:N/VI:L/VA:L/SC:N/SI:N/SA:N"
  records:
    acl-entry: [principal, sid, access, scope]
  cwe: "CWE-732"
  attack_techniques:
    - id: "T1574.005"
      basis:
        - "NIST AC-3 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST AC-6 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-732 relates to CAPEC-17, CAPEC-642, which CAPEC 3.9 maps to this technique"
    - id: "T1574.010"
      basis:
        - "NIST AC-3 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST AC-6 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-732 relates to CAPEC-1, CAPEC-17, CAPEC-180, which CAPEC 3.9 maps to this technique"
  description: >
    An access control entry grants write, modify or full control to
    Everyone, Authenticated Users or the Users group. Any account in the
    group, which for these groups is nearly every account on the host, can
    create, alter or delete content at the path. Each piece of evidence
    names the group, the access granted, and whether the grant is set on
    the path or inherited by it.
  impact: >
    A standard user or a process running as one can plant or replace files
    at the path. Where the path holds executables, libraries, scripts or
    configuration that a more privileged account loads, that is a route to
    running code with that account's rights.
  resolution: >
    Review each path in the evidence. Remove the grant where the group has
    no need to write there, with: icacls <path> /remove:g <group>, or
    narrow it to the accounts that need it. Some grants are Windows
    defaults; confirm against a clean installation before removing one.
  references:
    - source: NIST
      id: "AC-3"
    - source: NIST
      id: "AC-6"

permissions.unresolved_sid_grant:
  title: "Access is granted to an account that no longer exists"
  severity: "MEDIUM"
  cvss_score: 4.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N"
  records:
    acl-entry: [sid, access, scope]
  cwe: "CWE-732"
  description: >
    An access control entry grants write, modify or full control to a
    security identifier that resolves to no account. The entry outlived
    the account it was written for.
  impact: >
    The grant is dormant, not harmless. It documents access nobody
    reviews, and on a domain an identifier can come back into use through
    account restoration or SID history, at which point the access is live
    again.
  resolution: >
    Remove the entry with: icacls <path> /remove <SID>. Where many paths
    are affected, find the account that was deleted and review what else
    it had access to.
  references:
    - source: NIST
      id: "AC-6"

permissions.admin_share_present:
  title: "Default administrative shares are present"
  severity: "MEDIUM"
  cvss_score: 5.1
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N"
  records:
    share: [listing]
  no_weakness: "Administrative shares are a Windows default and no CWE entry describes them as a weakness; CWE-284 is discouraged by MITRE."
  attack_techniques:
    - id: "T1021.002"
      basis:
        - "NIST CM-7 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    Default Windows administrative shares (C$, ADMIN$, IPC$) are present.
    These shares are enabled by default and require Administrator credentials
    to access remotely. They are informational in most environments but
    represent a lateral movement path when Administrator credentials are
    compromised.
  impact: >
    An attacker with valid Administrator credentials can use administrative
    shares for remote file access and lateral movement (e.g. PsExec, WMI,
    SMB-based tools) without installing any additional software on the target.
  resolution: >
    In high-security environments where remote administration is not required,
    disable administrative shares via registry:
    HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\
    AutoShareWks = 0. This persists across reboots. IPC$ cannot be disabled.
  references:
    - source: CIS
      benchmark: "CIS Windows 11 Benchmark"
      version: "v3.0.0"
      id: "18.3"
    - source: NIST
      id: "CM-7"


