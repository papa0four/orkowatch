  references:
    - source: NIST
      id: "AC-3"

users.sssd_ldap_id_unencrypted:
  title: "SSSD looks up identities over an unencrypted LDAP connection"
  severity: "HIGH"
  cvss_score: 8.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N"
  records:
    setting: [value, state, line, version]
  cwe: "CWE-319"
  attack_techniques:
    - id: "T1040"
      basis:
        - "NIST SC-8 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    A domain SSSD serves takes its identities from an LDAP server off the
    host, named with an ldap:// URI, while ldap_id_use_start_tls is false. A
    server on a loopback address or localhost is not counted: that connection
    does not leave the host. sssd-ldap(5) says the
    option "Specifies that the id_provider connection must also use tls to
    protect the channel", that true "is strongly recommended for security
    reasons", and that "Even if the LDAP server is used only as an identity
    provider, an encrypted channel is strongly recommended." The default is
    false before SSSD 2.10.0 and true from it, so an unset option is judged
    by the release installed.
  impact: >
    An attacker on the network path between the host and the server can read
    the account data the host looks up, and can alter the answers: the user
    and group identifiers, group memberships, home directories and shells the
    host acts on.
  resolution: >
    Set ldap_id_use_start_tls = true in the domain section, or name the
    servers with ldaps:// URIs, and restart SSSD.
  references:
    - source: NIST
      id: "SC-8"
    - source: NIST
      id: "SC-8(1)"

users.sssd_ldap_cert_unchecked:
  title: "SSSD does not check the certificate of its LDAP server"
  severity: "CRITICAL"
  cvss_score: 9.1
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  records:
    setting: [value, line]
  cwe: "CWE-295"
  attack_techniques:
    - id: "T1557"
      basis:
        - "NIST SC-8 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST SC-23 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    A domain SSSD serves sets ldap_tls_reqcert to never or allow. sssd-ldap(5):
    "never = The client will not request or check any server certificate" and
    "allow = The server certificate is requested. If no certificate is
    provided, the session proceeds normally. If a bad certificate is provided,
    it will be ignored and the session proceeds normally." The default is
    hard.
  impact: >
    An attacker on the network path can stand in for the LDAP server on a
    connection the host believes is protected. sssd-ldap(5) says
    authentication takes place only over an encrypted channel, so the
    attacker receives the passwords users authenticate with, and answers the
    identity lookups the host makes.
  resolution: >
    Remove ldap_tls_reqcert from the domain section, or set it to demand,
    name the authority that signed the server certificate with
    ldap_tls_cacert or ldap_tls_cacertdir, and restart SSSD.
  references:
    - source: NIST
      id: "SC-8"
    - source: NIST
      id: "SC-23"

users.sssd_credentials_cached:
  title: "SSSD caches password hashes on the host"
  severity: "MEDIUM"
  cvss_score: 4.0
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:P/PR:H/UI:N/VC:N/VI:N/VA:N/SC:H/SI:N/SA:N"
  records:
    setting: [value, state, line]
  no_weakness: "Caching a salted hash so that logins work while the provider is unreachable is a documented feature; CWE-522 would apply only if the stored form were shown to be insufficiently protected, which the manual does not state."
  attack_techniques:
    - id: "T1003.005"
      basis:
        - "NIST IA-5 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    A domain SSSD serves sets cache_credentials = true, which is false unless
    set. sssd.conf(5): "Determines if user credentials are also cached in the
    local LDB cache", and, from SSSD 2.9, "while credentials are stored as a
    salted SHA512 hash, this still potentially poses some security risk in
    case an attacker manages to get access to a cache file (normally requires
    privileged access) and to break a password using brute force attack."
    offline_credentials_expiration, which limits for how many days a cached
    login is allowed, is recorded and not judged.
  impact: >
    An attacker who has gained root on the host can copy the cache and work
    on the hashes offline. Each password recovered belongs to a directory
    account, valid on every system that account can reach.
  resolution: >
    Where logins while the provider is unreachable are not needed, remove
    cache_credentials from the domain section or set it to false, and restart
    SSSD. Where they are needed, this is an accepted risk.
  references:
    - source: NIST
      id: "IA-5"
    - source: NIST
      id: "IA-5(13)"

users.sssd_krb5_tgt_unvalidated:
  title: "SSSD does not validate the Kerberos ticket it authenticates with"
  severity: "CRITICAL"
  cvss_score: 9.2
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    setting: [value, state, line]
  cwe: "CWE-290"
  description: >
    A domain SSSD serves authenticates with the krb5 provider while
    krb5_validate is false, which it is unless set. sssd-krb5(5): "Verify
    with the help of krb5_keytab that the TGT obtained has not been spoofed."
    Without it the host accepts a ticket-granting ticket without proving that
    the key distribution center that issued it holds the key of the host.
  impact: >
    An attacker who can answer the Kerberos requests of the host in place of
    the key distribution center can issue a ticket for any directory user
    with a password of the attacker's choosing, and log in to the host as
    that user.
  resolution: >
    Give the host a keytab holding its own principal, set krb5_validate = true
    in the domain section, and restart SSSD.
  references:
    - source: NIST
      id: "SC-23"

users.regular_user_admin_privileges:
  title: "Regular user account may run a shell as root through sudo"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    account: [uid, shell, grant, group]
  cwe: "CWE-266"
  attack_techniques:
    - id: "T1548.003"
      basis:
        - "NIST AC-6 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    sudo, asked as root, answers that a non-system account may run a shell
    as root on this host, on the account's own password or on none. The
    entries sudo lists for the account are recorded. sudoers(5): "A user
    specification determines which commands a user may run (and as what
    user) on specified hosts." An account sudo admits only where targetpw,
    rootpw or runaspw is in force is not counted: sudo then asks for a
    password the account does not hold by being admitted. A run that is not
    root cannot ask sudo, and records the accounts in the groups sudo,
    wheel and admin as members and not as accounts sudo admits. This may
    reflect intentional operator access or an unauthorized privilege
    assignment.
  impact: >
    Any process or attacker that gains access to this account and its
    password can run any command as root, and stop any service on the
    host, without requiring additional exploitation. The risk is
    proportional to the strength of the account's authentication and
    whether the administrative access is operationally justified.
  resolution: >
    List what sudo grants the account: sudo -l -U <account>. Remove the
    entry, or remove the account from the group the entry names, where
    elevated access is not required. Scope sudo rules to specific commands
    where full root access is not required.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.4.1"
    - source: NIST
      id: "AC-6"

users.sudo_nopasswd:
  title: "Sudoers entry permits privilege escalation without password"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    account: [uid, shell, grant]
  cwe: "CWE-306"
  attack_techniques:
    - id: "T1548.003"
      basis:
        - "NIST AC-6 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    sudo, asked as root, lists for an account an entry that asks for no
    password. sudoers(5): "By default, sudo requires that a user
    authenticate before running a command. This behavior can be modified
    via the NOPASSWD tag." and, of the authenticate flag, "If set, users
    must authenticate themselves via a password (or other means of
    authentication) before they may run commands. This default may be
    overridden via the PASSWD and NOPASSWD tags. This flag is on by
    default." The entries are recorded.
  impact: >
    Any attacker or process that gains access to the affected user account
    can immediately escalate to root or another privileged user without
    any additional credential. This eliminates the password barrier for
    privilege escalation entirely for the affected account.
  resolution: >
    Remove NOPASSWD tags from sudoers rules unless operationally required.
    Edit safely with: visudo. If NOPASSWD is required for automation,
    scope it to the minimum required commands rather than ALL.
  references:
    - source: NIST
      id: "AC-6"

users.login_shell_present:
  title: "User account has an interactive login shell"
  severity: "MEDIUM"
  cvss_score: 4.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N"
  records:
    account: [uid, shell]
  no_weakness: "CWE-272 concerns dropping an elevated privilege after an operation such as chroot(), which an account with a login shell is not."
  description: >
    A user account has an interactive login shell assigned. For regular
    operator accounts this is expected. For accounts that should not
    require interactive access (service accounts, daemon accounts, or
    legacy accounts), an interactive shell represents an unnecessary
    attack surface. This finding is informational -- context determines
    whether it is a misconfiguration or intended policy.
  impact: >
    An account with an interactive shell that is compromised or
    misused provides an attacker with a full interactive session.
    Service accounts with login shells are a common persistence and
    lateral movement vector when combined with weak or absent passwords.
  resolution: >
    For accounts that do not require interactive access, set the shell
    to a nologin or false variant: usermod -s /usr/sbin/nologin
    <username>. Review all accounts with interactive shells and confirm
    each is operationally justified.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.4.2"
    - source: NIST
      id: "AC-2"

users.no_password_login_shell:
  title: "Account with no password set has a valid login shell"
  severity: "CRITICAL"
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  records:
    account: [uid, shell]
  cwe: "CWE-1390"
  attack_techniques:
    - id: "T1078.003"
      basis:
        - "NIST IA-5 maps to its parent technique T1078 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST IA-2 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    A user account has no password set in /etc/shadow and is assigned
    an interactive login shell. An account with no password hash and a
    valid shell can be accessed without any credential on systems where
    password authentication is not explicitly required for all accounts.
  impact: >
    Any local or remote attacker can authenticate as this account without
    providing a password if the authentication stack permits empty
    credentials. Combined with an interactive shell, this grants an
    attacker a full session under the affected account without any
    exploitation required.
  resolution: >
    Either set a strong password for the account or replace the login
    shell with a nologin variant: usermod -s /usr/sbin/nologin <username>.
    If the account is no longer needed, lock or remove it: passwd -l
    <username> or userdel <username>. Audit all accounts with empty
    password fields: awk -F: '$2 == "" ' /etc/shadow.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.4.1"
    - source: NIST
      id: "IA-5"
    - source: NIST
      id: "IA-2"

# -------------------------
# Permissions checker findings
# -------------------------

permissions.critical_path_not_root_owned:
  title: "Critical system path is not owned by root"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    file: [description, uid, expected]
  cwe: "CWE-282"
  description: >
    A file or directory the system relies on for authentication, privilege
    assignment or service configuration is owned by an account other than
    root. Ownership is what a permission mode cannot express: a mode that
    is correct for a root-owned path grants the same access to whoever
    owns it, and the owner of a file may change its mode at will
    regardless of what the current mode allows.
  impact: >
    The owning account can rewrite the file's contents and relax its
    permissions without privilege escalation. For an authentication or
    sudo configuration file this is a direct path to root; for a service
    configuration it allows the service to be redirected or disabled.
  resolution: >
    Restore root ownership: chown root <path>, keeping the group the
    distribution assigns, since some paths are group-owned by a dedicated
    group such as shadow or syslog by design. Investigate how ownership
    changed before restoring it, because the change itself indicates
    either a misapplied administrative action or unauthorized access.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1"
    - source: NIST
      id: "AC-3"

permissions.path_exceeds_expected_mode:
  title: "File or directory permissions exceed expected mode"
  severity: "MEDIUM"
  cvss_score: 6.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  records:
    file: [description, mode, expected]
  cwe: "CWE-732"
  description: >
    A critical system file or directory has permissions that exceed the
    expected mode defined by CIS benchmarks. Overly permissive settings
    on files such as /etc/passwd, /etc/shadow, or /etc/sudoers allow
    unauthorized users to read or modify sensitive system data.
  impact: >
    World-readable shadow files expose password hashes to offline cracking.
    World-writable configuration files allow unauthorized modification of
    authentication, sudo, or service configuration. The specific impact
    depends on which path is affected.
  resolution: >
    Restore the expected mode with chmod, following the distribution's own
    convention rather than one fixed value: /etc/passwd 644, /etc/sudoers
    440, and for /etc/shadow the mode the distribution ships, which is 640
    where a dedicated shadow group reads it on behalf of unprivileged PAM
    helpers and more restrictive where root alone reads it. A mode stricter
    than the expectation is never reported, so tightening further is always
    safe. Consult the CIS benchmark for the specific distribution before
    relaxing any path.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1"
    - source: NIST
      id: "AC-3"

permissions.world_writable_file:
  title: "World-writable file found on the scanned filesystem"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    file: [mode, uid, gid, unresolved, reach, location]
  environment:
    - metric: MPR
      kind: file
      fact: reach
      cases:
        - value: root-only
          set: H
          guide: mpr-restricting-access-to-administrative-users
          because: "no principal other than root can traverse the directories leading to the file, so only root can reach it to write it"
  cwe: "CWE-732"
  description: >
    A file with world-writable permissions (mode includes 0002) was found
    during the filesystem scan. World-writable files can be modified by
    any local user regardless of ownership, enabling content injection,
    configuration tampering, or script replacement.
  impact: >
    Any local user or process can overwrite the file contents. On executable
    files or scripts run by privileged processes, this enables direct
    privilege escalation. On configuration files, this enables service
    manipulation or credential injection.
  resolution: >
    Remove world-writable permission immediately: chmod o-w <path>.
    Investigate why the permission was set and whether the file was
    modified. Audit cron jobs, service scripts, and init files that
    reference the affected path.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1.10"
    - source: NIST
      id: "AC-3"

permissions.suid_sgid_binary:
  title: "SUID or SGID binary found"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  records:
    file: [mode, uid, gid, unresolved, reach, location]
  environment:
    - metric: MPR
      kind: file
      fact: reach
      cases:
        - value: root-only
          set: H
          guide: mpr-low-privileged-user-cannot-execute
          because: "no principal other than root can traverse the directories leading to the binary, so a low-privileged user cannot reach it to execute it"
  cwe: "CWE-267"
  attack_techniques:
    - id: "T1548.001"
      basis:
        - "NIST AC-6 maps to its parent technique T1548 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST CM-7 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    A binary with the SUID or SGID bit set was found. SUID binaries
    execute with the file owner's privileges rather than the calling
    user's privileges. Unexpected SUID binaries may have been planted
    for privilege escalation or left from misconfigured software
    installation.
  impact: >
    Exploitation of a vulnerable SUID binary allows a low-privileged
    user to execute code as root or another privileged user without
    sudo access. SUID binaries with known vulnerabilities are a common
    local privilege escalation vector.
  resolution: >
    Audit all SUID/SGID binaries: find / -perm /6000 -type f. Remove
    the SUID bit from any binary that does not require it: chmod u-s
    <path>. Compare against a known-good baseline for the distribution
    to identify unexpected additions.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1.11, §6.1.12"
    - source: NIST
      id: "AC-6"
    - source: NIST
      id: "CM-7"

permissions.unowned_file:
  title: "File with no valid owner or group found"
  severity: "MEDIUM"
  cvss_score: 4.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N"
  records:
    file: [mode, uid, gid, unresolved, reach, location]
  cwe: "CWE-732"
  description: >
    A file with no valid owning user or group was found. Unowned files
    typically result from user account deletion without cleaning up
    associated files, or from improper software installation. They
    represent an ownership gap that may be exploitable.
  impact: >
    Unowned files can be claimed by any user who creates an account with
    the matching numeric UID or GID. If the file is a binary, script,
    or configuration file in a sensitive location, the new owner gains
    control over it, potentially enabling privilege escalation.
  resolution: >
    Assign appropriate ownership: chown <user>:<group> <path>. If the
    file is not needed, remove it. Audit recently deleted accounts to
    identify the source of orphaned files.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1.13, §6.1.14"
    - source: NIST
      id: "AC-3"
