users.nslcd_cert_unchecked:
  title: "nslcd does not check the certificate of its LDAP server"
  severity: "CRITICAL"
  cvss_score: 9.1
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  records:
    setting: [value, line]
  cwe: "CWE-295"
  attack_techniques:
    - id: "T1557"
      basis:
        - "NIST SC-8 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST SC-23 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    The host is wired to nslcd, /etc/nslcd.conf has it use TLS, by an
    ldaps:// server or an ssl line of on or start_tls, and the tls_reqcert in
    force is never or allow. nslcd.conf(5): "Specifies what checks to perform
    on a server-supplied certificate. The meaning of the values is described
    in the ldap.conf(5) manual page." ldap.conf(5): never, "The client will
    not request or check any server certificate"; allow, "If a bad
    certificate is provided, it will be ignored and the session proceeds
    normally." The last tls_reqcert line is the one in force, and nslcd reads
    no as never. With none set, nslcd refuses a certificate that does not
    verify.
  impact: >
    An attacker on the network path can stand in for the LDAP server on a
    connection the host believes is protected: answer the account lookups the
    host makes, and receive the passwords users log in with where a PAM rule
    names pam_ldap.so.
  resolution: >
    Remove tls_reqcert from /etc/nslcd.conf, or set it to demand, name the
    authority that signed the server certificate with tls_cacertfile or
    tls_cacertdir, and restart nslcd.
  references:
    - source: NIST
      id: "SC-8"
    - source: NIST
      id: "SC-23"

users.nslcd_password_readable:
  title: "nslcd.conf holds a password and can be read by accounts other than root"
  severity: "MEDIUM"
