    - source: NIST
      id: "IA-5"

users.nslcd_ignorecase:
  title: "nslcd matches account names without regard to case"
  severity: "LOW"
  cvss_score: 2.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:L/VI:L/VA:L/SC:N/SI:N/SA:N"
  records:
    setting: [value, line]
  cwe: "CWE-178"
  description: >
    The host is wired to nslcd and /etc/nslcd.conf sets ignorecase to yes.
    nslcd.conf(5) says the option makes searches of the group, netgroup,
    passwd, protocols, rpc, services, and shadow maps match without regard
    to case, and warns that setting it to yes could open the system to
    authorization bypass vulnerabilities and to nscd cache poisoning
    vulnerabilities that allow denial of service. By default the searches
    match case exactly. The last ignorecase line is the one in force.
  impact: >
    A name that differs from an account's only in case resolves to that
    account. A rule on the host that grants or denies by name, written for
    one spelling, can be passed with another, and a name service cache can
    be filled with entries under the wrong spelling.
  resolution: >
    Remove ignorecase from /etc/nslcd.conf, or set it to no, and restart
    nslcd.
  references:
    - source: NIST
      id: "AC-3"

users.kerberos_configured:
  title: "Kerberos configuration or wiring is present"
