# Linux common finding definitions for the orkowatch registry.
# These findings apply across all Linux distributions regardless of family.
# Each cvss_vector is the CVSS v4.0 baseline of the condition, scored by FIRST's algorithm,
# and each cvss_score is the one its vector computes. Severity tiers follow the score
# ranges of the specification's Table 22. The registry refuses to load a definition where
# the severity, the score and the vector disagree:
#   CRITICAL 9.0-10.0 | HIGH 7.0-8.9 | MEDIUM 4.0-6.9 | LOW 0.1-3.9
# A NIST reference names only the control: its title and release come from the
# bundled catalog (nist.yaml), which load checks it against. Any other reference
# states its source, the edition checked and the date it was verified (see
# registry.ReferenceSpec); one with no verified date has not been checked and is
# withheld from every report. The weakness a definition maps to is its cwe field,
# and its reference is built from that.

# -------------------------
# SSH checker findings
# -------------------------

ssh.config_not_found:
  title: "SSH daemon configuration file not found"
  severity: "MEDIUM"
  cvss_score: 4.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:L/SC:N/SI:N/SA:N"
  no_weakness: "CWE-16 is an obsolete grouping that MITRE prohibits for mapping, and no entry describes a missing configuration file."
  description: >
    No sshd_config file was found at any expected path. Without an explicit
    configuration file, sshd falls back to compiled-in defaults which vary
    by distribution and OpenSSH version. Default configurations frequently
    permit password authentication and may not restrict root login.
  impact: >
    An SSH daemon running without an explicit configuration file may permit
    password-based authentication, weak ciphers, or root login depending on
    compiled defaults. The security posture of the service cannot be verified
    without a configuration file present.
  resolution: >
    Create /etc/ssh/sshd_config with explicit directives for
    PasswordAuthentication, PermitRootLogin, AllowUsers, and cipher
    suites. Restart sshd after making changes: systemctl restart sshd.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.2"
    - source: NIST
      id: "CM-6"

ssh.root_login_permitted:
  title: "SSH PermitRootLogin is not explicitly disabled"
  severity: "CRITICAL"
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  cwe: "CWE-250"
  attack_techniques:
    - id: "T1021.004"
      basis:
        - "NIST AC-6 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST IA-2 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    PermitRootLogin is not set to no in sshd_config. Direct root login
    over SSH gives an attacker full system control upon credential compromise
    with no privilege escalation step required. OpenSSH defaults vary by
    version — absence of this directive is not safe.
  impact: >
    A successful brute-force, credential stuffing, or key theft attack
    against the root account yields immediate full control of the host.
    No additional exploitation step is required post-authentication.
    Combined with password authentication, this represents maximum SSH
    exposure.
  resolution: >
    Set PermitRootLogin no in /etc/ssh/sshd_config and restart sshd.
    Administrative access should use key-based authentication to a
    non-privileged account followed by explicit privilege escalation
    via sudo.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.2.8"
    - source: NIST
      id: "AC-6"
    - source: NIST
      id: "IA-2"

ssh.password_auth_enabled:
  title: "SSH password authentication is enabled"
  severity: "HIGH"
  cvss_score: 8.7
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  cwe: "CWE-521"
  attack_techniques:
    - id: "T1021.004"
      basis:
        - "NIST IA-5(1) maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-521 relates to CAPEC-555, which CAPEC 3.9 maps to its parent technique T1021"
    - id: "T1110.001"
      basis:
        - "NIST IA-5(1) maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "CWE-521 relates to CAPEC-49, which CAPEC 3.9 maps to this technique"
  description: >
    PasswordAuthentication is set to yes in sshd_config. Password-based
    SSH authentication is susceptible to brute-force and credential stuffing
    attacks. Any account reachable via SSH with a weak or reused password
    is directly at risk.
  impact: >
    Automated brute-force tools can systematically attempt credentials
    against the SSH service. Credential exposure from unrelated data
    breaches directly translates to SSH access risk for any account
    with a matching password.
  resolution: >
    Set PasswordAuthentication no in /etc/ssh/sshd_config and configure
    key-based authentication exclusively. Distribute authorized_keys to
    required users before disabling password auth to avoid lockout.
    Restart sshd after changes.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.2.11"
    - source: NIST
      id: "IA-5(1)"

ssh.permit_root_login_not_set:
  title: "PermitRootLogin directive is absent from SSH configuration"
  severity: "HIGH"
  cvss_score: 8.7
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  no_weakness: "CWE-16 is an obsolete grouping that MITRE prohibits for mapping. The directive is absent, so the daemon's default applies and the check does not read it; CWE-1188 would apply only if that default were shown to be insecure."
  description: >
    The PermitRootLogin directive was not found in sshd_config. OpenSSH
    compiled defaults vary by distribution and version. On some systems
    the default permits root login; on others it does not. Absence of
    an explicit setting leaves the behavior undefined and
    distribution-dependent.
  impact: >
    Without an explicit PermitRootLogin directive, the effective policy
    depends on the OpenSSH build configuration for the installed version.
    System updates or package replacements may silently change the
    effective default.
  resolution: >
    Add PermitRootLogin no explicitly to /etc/ssh/sshd_config regardless
    of the assumed default. Explicit configuration is always safer than
    relying on compiled-in defaults.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.2.8"
    - source: NIST
      id: "CM-6"

ssh.password_auth_not_set:
  title: "PasswordAuthentication directive is absent from SSH configuration"
  severity: "HIGH"
  cvss_score: 8.7
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  no_weakness: "CWE-16 is an obsolete grouping that MITRE prohibits for mapping. The directive is absent, so the daemon's default applies and the check does not read it; CWE-1188 would apply only if that default were shown to be insecure."
  attack_techniques:
    - id: "T1021.004"
      basis:
        - "NIST CM-6 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    The PasswordAuthentication directive was not found in sshd_config.
    OpenSSH defaults to permitting password authentication when this
    directive is absent, meaning the service may accept password-based
    logins even without explicit configuration.
  impact: >
    Password authentication may be silently active. Any account accessible
    via SSH with a weak or reused password is exposed to brute-force
    attacks without the operator being aware that password auth is enabled.
  resolution: >
    Add PasswordAuthentication no explicitly to /etc/ssh/sshd_config.
    Configure key-based authentication before disabling password auth
    to prevent lockout. Restart sshd after changes.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.2.11"
    - source: NIST
      id: "CM-6"

# -------------------------
# Firewall checker findings
# -------------------------

firewall.no_active_manager:
  title: "No active firewall manager detected"
  severity: "CRITICAL"
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  cwe: "CWE-923"
  attack_techniques:
    - id: "T1686"
      basis:
        - "NIST CM-6 maps to this technique, listed there as T1562.004 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    None of the recognized firewall managers (iptables, ufw, firewalld,
    pfctl) are active on this system. The host has no detected host-based
    packet filtering in place. All listening services are reachable on
    all interfaces without network-level access control.
  impact: >
    Every service bound to a network interface is directly reachable without
    restriction. This eliminates host-based network controls as a
    defense-in-depth layer against exploitation, lateral movement, and
    unauthorized access to internal services.
  resolution: >
    Install and enable an appropriate firewall manager for the distribution.
    On Debian/Ubuntu: ufw enable. On RHEL/Fedora: systemctl enable --now
    firewalld. Configure rules to permit only required traffic and deny
    all else by default.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "3.5"
    - source: NIST
      id: "SC-7"
    - source: NIST
      id: "CM-6"

firewall.ufw_inactive:
  title: "UFW firewall is installed but not enforcing"
  severity: "HIGH"
  cvss_score: 8.8
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:N/SI:N/SA:N"
  cwe: "CWE-923"
  attack_techniques:
    - id: "T1686"
      basis:
        - "NIST CM-6 maps to this technique, listed there as T1562.004 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    Uncomplicated Firewall (UFW) is installed and reports its status as
    inactive, so no host-based packet filtering is enforced on any network
    interface despite the tool being present. UFW is available on every
    major distribution, not only those that ship it by default.
  impact: >
    All listening services are reachable on all interfaces without
    restriction. UFW being inactive despite installation suggests the
    firewall was intentionally disabled or never enabled after
    installation, leaving the host without a host-based network control
    layer.
  resolution: >
    Enable UFW and configure a default-deny policy: ufw default deny
    incoming && ufw default allow outgoing && ufw enable. Add explicit
    allow rules for required services before enabling to avoid lockout:
    ufw allow ssh.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "3.5"
    - source: NIST
      id: "SC-7"
    - source: NIST
      id: "CM-6"

firewall.firewalld_not_running:
  title: "firewalld is installed but not running"
  severity: "HIGH"
  cvss_score: 8.8
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:N/SI:N/SA:N"
  cwe: "CWE-923"
  attack_techniques:
    - id: "T1686"
      basis:
        - "NIST CM-6 maps to this technique, listed there as T1562.004 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    The firewalld daemon is installed but is not running, so the zone
    policy it manages is not being enforced. No host-based packet
    filtering is applied by firewalld on any interface. firewalld is
    available on every major distribution, not only those that ship it by
    default.
  impact: >
    Every service bound to a network interface is reachable without the
    zone restrictions firewalld would otherwise apply. A configured zone
    policy that is not running provides no protection while giving the
    appearance of a managed firewall.
  resolution: >
    Start and enable the daemon: systemctl enable --now firewalld. Confirm
    the active zone and its permitted services afterwards with
    firewall-cmd --list-all, and narrow the zone to the services the host
    actually offers.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "3.5"
    - source: NIST
      id: "SC-7"
    - source: NIST
      id: "CM-6"

firewall.iptables_default_accept:
  title: "iptables INPUT chain accepts by default with no ingress rules"
  severity: "HIGH"
  cvss_score: 8.8
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:N/SI:N/SA:N"
  cwe: "CWE-1188"
  attack_techniques:
    - id: "T1686"
      basis:
        - "NIST CM-6 maps to this technique, listed there as T1562.004 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    The iptables INPUT chain has a default policy of ACCEPT and holds no
    rules, so every packet arriving at the host is permitted. A secure
    posture requires either a default DROP or REJECT policy with explicit
    allow rules, or an INPUT chain whose rules decide what is admitted.
    Rules in other chains do not constrain ingress to the host itself.
  impact: >
    Any service listening on any interface is reachable unless explicitly
    blocked, and none is. New services started on the host become
    network-accessible without any firewall change, which inverts the
    intended deny-by-default security model.
  resolution: >
    Set a default DROP policy on the INPUT chain: iptables -P INPUT DROP.
    Add explicit ACCEPT rules for required traffic before applying the
    default drop to avoid lockout, and persist the result through the
    distribution's iptables restore mechanism so it survives reboot.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "3.5"
    - source: NIST
      id: "SC-7"
    - source: NIST
      id: "CM-6"

# -------------------------
# User checker findings
# -------------------------

users.empty_password_hash:
  title: "User account has no password set in /etc/shadow"
  severity: "CRITICAL"
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  cwe: "CWE-258"
  attack_techniques:
    - id: "T1078.003"
      basis:
        - "NIST IA-5 maps to its parent technique T1078 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST IA-2 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    One or more user accounts have an empty password hash field in
    /etc/shadow. An empty hash means the account has no password and
    can be accessed without any credential on systems where password
    authentication is permitted.
  impact: >
    Any local or remote attacker can authenticate as this user without
    providing a password. If the account has sudo access or elevated
    privileges, this represents an immediate critical compromise path
    requiring no exploitation.
  resolution: >
    Set a strong password immediately: passwd <username>. If the account
    is a service account that should not allow interactive login, lock it:
    passwd -l <username> and set the shell to /usr/sbin/nologin in
    /etc/passwd.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.2.1"
    - source: NIST
      id: "IA-5"
    - source: NIST
      id: "IA-2"

users.uid_zero_non_root:
  title: "Non-root account has UID 0"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  cwe: "CWE-266"
  description: >
    A user account other than root has been assigned UID 0. On Linux and
    Unix systems, UID 0 confers full superuser privileges regardless of
    the account name. Any account with UID 0 is effectively root.
  impact: >
    Compromise of any UID 0 account yields complete system control
    identical to compromising the root account. Multiple UID 0 accounts
    expand the attack surface for privilege escalation and make audit
    trails ambiguous — actions appear to come from different accounts
    but carry identical privileges.
  resolution: >
    Immediately reassign a non-zero UID to the affected account or
    remove it if it is not required: usermod -u <new_uid> <username>.
    Investigate how UID 0 was assigned and whether unauthorized access
    occurred. Only the root account should have UID 0.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.2.5"
    - source: NIST
      id: "AC-6"

users.root_account_unlocked:
  title: "Root account is not locked"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  no_weakness: "No CWE entry describes an unlocked root account; CWE-284, the nearest class, is discouraged by MITRE."
  description: >
    The root account is not in a locked state. On systems where
    administrative access is managed via sudo, the root account itself
    should be locked to prevent direct root login via password
    authentication while preserving sudo-based escalation.
  impact: >
    An unlocked root account with a password can be targeted directly
    via SSH brute-force if PermitRootLogin is not explicitly disabled,
    or via local authentication bypass techniques. Locking root forces
    all privileged access through auditable sudo paths.
  resolution: >
    Lock the root account password: passwd -l root. Ensure sudo is
    configured to provide necessary administrative access before locking.
    Verify PermitRootLogin no is set in sshd_config independently.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.4.1"
    - source: NIST
      id: "AC-6"

users.ldap_configured:
  title: "LDAP authentication is configured"
  severity: "MEDIUM"
  cvss_score: 4.6
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:H/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N"
  no_weakness: "The finding reports where authentication is performed, not a weakness; CWE-287 is discouraged by MITRE."
  description: >
    /etc/ldap.conf is present, indicating LDAP-based authentication is
    configured. LDAP authentication introduces a network dependency for
    local login and may expose credentials if the LDAP connection is
    not encrypted.
  impact: >
    If LDAP is configured without TLS/LDAPS, credentials are transmitted
    in cleartext over the network. An LDAP server outage may prevent
    local login. Misconfigured LDAP referrals can expose the system to
    authentication bypass.
  resolution: >
    Verify LDAP is configured with TLS (ldaps:// or StartTLS).
    Ensure a local fallback authentication method exists for system
    recovery. Review /etc/ldap.conf for cleartext bind credentials.
  references:
    - source: NIST
      id: "IA-2"

users.kerberos_configured:
  title: "Kerberos authentication is configured"
  severity: "MEDIUM"
  cvss_score: 4.6
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:H/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N"
  no_weakness: "The finding reports where authentication is performed, not a weakness; CWE-287 is discouraged by MITRE."
  attack_techniques:
    - id: "T1558.005"
      basis:
        - "NIST IA-2 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    /etc/krb5.conf is present, indicating Kerberos authentication is
    configured. Kerberos introduces a KDC dependency for authentication
    and requires time synchronization within 5 minutes to function
    correctly.
  impact: >
    KDC unavailability or clock skew may prevent authentication. Weak
    Kerberos encryption types (DES, RC4) in krb5.conf expose ticket
    traffic to offline cracking. Misconfigured realms may permit
    cross-realm authentication abuse.
  resolution: >
    Review /etc/krb5.conf for deprecated encryption types and remove
    DES and RC4 entries. Ensure time synchronization is configured.
    Verify KDC redundancy for availability.
  references:
    - source: NIST
      id: "IA-2"

users.sssd_configured:
  title: "SSSD authentication is configured"
  severity: "MEDIUM"
  cvss_score: 4.6
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:H/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N"
  no_weakness: "The finding reports where authentication is performed, not a weakness; CWE-287 is discouraged by MITRE."
  attack_techniques:
    - id: "T1003.005"
      basis:
        - "NIST IA-2 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    /etc/sssd/sssd.conf is present, indicating the System Security
    Services Daemon is configured for centralized identity management.
    SSSD introduces external identity provider dependencies for
    authentication.
  impact: >
    SSSD misconfiguration or identity provider unavailability may prevent
    login. Overly permissive SSSD filter configurations may allow
    unauthorized accounts to authenticate. Cache poisoning is possible
    if SSSD offline caching is misconfigured.
  resolution: >
    Review /etc/sssd/sssd.conf for access_provider and ldap_access_filter
    settings. Ensure the identity provider connection uses TLS. Test
    offline authentication behavior to verify local fallback functions
    correctly.
  references:
    - source: NIST
      id: "IA-2"

users.regular_user_admin_privileges:
  title: "Regular user account has administrative group membership"
  severity: "HIGH"
  cvss_score: 8.4
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  cwe: "CWE-266"
  attack_techniques:
    - id: "T1548.003"
      basis:
        - "NIST AC-6 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    A non-system user account is a member of a privileged group (sudo or
    wheel). Administrative group membership grants the ability to execute
    commands as root via sudo. This may reflect intentional operator
    access or an unauthorized privilege assignment.
  impact: >
    Any process or attacker that gains access to this account can escalate
    to root via sudo without requiring additional exploitation. The risk
    is proportional to the strength of the account's authentication and
    whether the administrative access is operationally justified.
  resolution: >
    Review sudo and wheel group membership: getent group sudo wheel.
    Remove any account from administrative groups that does not require
    elevated access. Scope sudo rules to specific commands where full
    root access is not required.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.4.1"
    - source: NIST
      id: "AC-6"

users.login_shell_present:
  title: "User account has an interactive login shell"
  severity: "MEDIUM"
  cvss_score: 4.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N"
  no_weakness: "CWE-272 concerns dropping an elevated privilege after an operation such as chroot(), which an account with a login shell is not."
  description: >
    A user account has an interactive login shell assigned. For regular
    operator accounts this is expected. For accounts that should not
    require interactive access (service accounts, daemon accounts, or
    legacy accounts), an interactive shell represents an unnecessary
    attack surface. This finding is informational -- context determines
    whether it is a misconfiguration or intended policy.
  impact: >
    An account with an interactive shell that is compromised or
    misused provides an attacker with a full interactive session.
    Service accounts with login shells are a common persistence and
    lateral movement vector when combined with weak or absent passwords.
  resolution: >
    For accounts that do not require interactive access, set the shell
    to a nologin or false variant: usermod -s /usr/sbin/nologin
    <username>. Review all accounts with interactive shells and confirm
    each is operationally justified.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.4.2"
    - source: NIST
      id: "AC-2"

users.no_password_login_shell:
  title: "Account with no password set has a valid login shell"
  severity: "CRITICAL"
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  cwe: "CWE-1390"
  attack_techniques:
    - id: "T1078.003"
      basis:
        - "NIST IA-5 maps to its parent technique T1078 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST IA-2 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    A user account has no password set in /etc/shadow and is assigned
    an interactive login shell. An account with no password hash and a
    valid shell can be accessed without any credential on systems where
    password authentication is not explicitly required for all accounts.
  impact: >
    Any local or remote attacker can authenticate as this account without
    providing a password if the authentication stack permits empty
    credentials. Combined with an interactive shell, this grants an
    attacker a full session under the affected account without any
    exploitation required.
  resolution: >
    Either set a strong password for the account or replace the login
    shell with a nologin variant: usermod -s /usr/sbin/nologin <username>.
    If the account is no longer needed, lock or remove it: passwd -l
    <username> or userdel <username>. Audit all accounts with empty
    password fields: awk -F: '$2 == "" ' /etc/shadow.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "5.4.1"
    - source: NIST
      id: "IA-5"
    - source: NIST
      id: "IA-2"

# -------------------------
# Permissions checker findings
# -------------------------

permissions.critical_path_not_root_owned:
  title: "Critical system path is not owned by root"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  cwe: "CWE-282"
  description: >
    A file or directory the system relies on for authentication, privilege
    assignment or service configuration is owned by an account other than
    root. Ownership is what a permission mode cannot express: a mode that
    is correct for a root-owned path grants the same access to whoever
    owns it, and the owner of a file may change its mode at will
    regardless of what the current mode allows.
  impact: >
    The owning account can rewrite the file's contents and relax its
    permissions without privilege escalation. For an authentication or
    sudo configuration file this is a direct path to root; for a service
    configuration it allows the service to be redirected or disabled.
  resolution: >
    Restore root ownership: chown root <path>, keeping the group the
    distribution assigns, since some paths are group-owned by a dedicated
    group such as shadow or syslog by design. Investigate how ownership
    changed before restoring it, because the change itself indicates
    either a misapplied administrative action or unauthorized access.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1"
    - source: NIST
      id: "AC-3"

permissions.path_exceeds_expected_mode:
  title: "File or directory permissions exceed expected mode"
  severity: "MEDIUM"
  cvss_score: 6.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  cwe: "CWE-732"
  description: >
    A critical system file or directory has permissions that exceed the
    expected mode defined by CIS benchmarks. Overly permissive settings
    on files such as /etc/passwd, /etc/shadow, or /etc/sudoers allow
    unauthorized users to read or modify sensitive system data.
  impact: >
    World-readable shadow files expose password hashes to offline cracking.
    World-writable configuration files allow unauthorized modification of
    authentication, sudo, or service configuration. The specific impact
    depends on which path is affected.
  resolution: >
    Restore the expected mode with chmod, following the distribution's own
    convention rather than one fixed value: /etc/passwd 644, /etc/sudoers
    440, and for /etc/shadow the mode the distribution ships, which is 640
    where a dedicated shadow group reads it on behalf of unprivileged PAM
    helpers and more restrictive where root alone reads it. A mode stricter
    than the expectation is never reported, so tightening further is always
    safe. Consult the CIS benchmark for the specific distribution before
    relaxing any path.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1"
    - source: NIST
      id: "AC-3"

permissions.world_writable_file:
  title: "World-writable file found on the scanned filesystem"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  cwe: "CWE-732"
  description: >
    A file with world-writable permissions (mode includes 0002) was found
    during the filesystem scan. World-writable files can be modified by
    any local user regardless of ownership, enabling content injection,
    configuration tampering, or script replacement.
  impact: >
    Any local user or process can overwrite the file contents. On executable
    files or scripts run by privileged processes, this enables direct
    privilege escalation. On configuration files, this enables service
    manipulation or credential injection.
  resolution: >
    Remove world-writable permission immediately: chmod o-w <path>.
    Investigate why the permission was set and whether the file was
    modified. Audit cron jobs, service scripts, and init files that
    reference the affected path.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1.10"
    - source: NIST
      id: "AC-3"

permissions.suid_sgid_binary:
  title: "SUID or SGID binary found"
  severity: "HIGH"
  cvss_score: 8.5
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  cwe: "CWE-267"
  attack_techniques:
    - id: "T1548.001"
      basis:
        - "NIST AC-6 maps to its parent technique T1548 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST CM-7 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    A binary with the SUID or SGID bit set was found. SUID binaries
    execute with the file owner's privileges rather than the calling
    user's privileges. Unexpected SUID binaries may have been planted
    for privilege escalation or left from misconfigured software
    installation.
  impact: >
    Exploitation of a vulnerable SUID binary allows a low-privileged
    user to execute code as root or another privileged user without
    sudo access. SUID binaries with known vulnerabilities are a common
    local privilege escalation vector.
  resolution: >
    Audit all SUID/SGID binaries: find / -perm /6000 -type f. Remove
    the SUID bit from any binary that does not require it: chmod u-s
    <path>. Compare against a known-good baseline for the distribution
    to identify unexpected additions.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1.11, §6.1.12"
    - source: NIST
      id: "AC-6"
    - source: NIST
      id: "CM-7"

permissions.unowned_file:
  title: "File with no valid owner or group found"
  severity: "MEDIUM"
  cvss_score: 4.8
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N"
  cwe: "CWE-732"
  description: >
    A file with no valid owning user or group was found. Unowned files
    typically result from user account deletion without cleaning up
    associated files, or from improper software installation. They
    represent an ownership gap that may be exploitable.
  impact: >
    Unowned files can be claimed by any user who creates an account with
    the matching numeric UID or GID. If the file is a binary, script,
    or configuration file in a sensitive location, the new owner gains
    control over it, potentially enabling privilege escalation.
  resolution: >
    Assign appropriate ownership: chown <user>:<group> <path>. If the
    file is not needed, remove it. Audit recently deleted accounts to
    identify the source of orphaned files.
  references:
    - source: CIS
      benchmark: "CIS Distribution Independent Linux Benchmark"
      version: "v2.0.0"
      id: "6.1.13, §6.1.14"
    - source: NIST
      id: "AC-3"
