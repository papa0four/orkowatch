    nss-database: [line, value]
    pam-rule: [line, services]
    setting: [state]
  description: >
    /etc/sssd/sssd.conf or a snippet in /etc/sssd/conf.d is present, or the
    name service switch names the sss
    service or a PAM rule names pam_sss.so, which ask the System Security
    Services Daemon to look up or authenticate accounts against a directory
    or identity provider. Each is recorded with where it was found. A
    distribution can ship the wiring by default or add it when the packages
    are installed, so neither the file nor the wiring shows that SSSD is
    used. The domains SSSD serves, which do show it, are recorded where the
    configuration names any, and what the configuration sets is judged by
    the SSSD rules.
  impact: >
    Where SSSD is used, account lookups, and with pam_sss.so in the PAM
    stack the passwords given at login, go to the providers sssd.conf
    names. Whether its connections to them are encrypted and whether
    password hashes are cached on the host are set in this file and the
    snippets in /etc/sssd/conf.d.
  resolution: >
    Review /etc/sssd/sssd.conf and /etc/sssd/conf.d. sssd.conf(5) requires
    the file to be accessible only by root or the user SSSD runs as, and the
