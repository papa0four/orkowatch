    account other than root or the one SSSD runs as. Before SSSD 2.10.0,
    sssd.conf(5) requires the file to be "owned by root and only root may
    read from or write to the file", and snippets to have the same owner and
    permissions. From 2.10.0 it "must be a regular file that is accessible
    only by the user used to run SSSD service or root". The file is judged by
    the rule of the release installed, whether or not SSSD is in use.
  impact: >
    A local account can read the directory servers, search bases and options
    the host uses, and the bind credential where ldap_default_authtok is set
    in the file.
  resolution: >
    Before SSSD 2.10.0: chown root:root and chmod 0600 the file. From
    2.10.0: give it to root or the sssd user, allow group access to the sssd
