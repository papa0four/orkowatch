  description: >
    A PAM rule names pam_ldap.so, which asks nslcd to authenticate the user,
    and /etc/nslcd.conf names an ldap:// server off the host, or has nslcd
    find its servers in DNS, with no ssl line of on or start_tls.
    nslcd.conf(5), for ssl: "Specifies whether to use SSL/TLS or not (the
    default is not to)". nslcd authenticates a user by binding to the server
    as that user with the password given at login, and was seen to send that
    bind in clear under this configuration. A server on a loopback address,
