  records:
    file: [mode, uid, gid, expected]
    setting: [line]
  cwe: "CWE-732"
  attack_techniques:
    - id: "T1552.001"
      basis:
        - "NIST AC-3 maps to its parent technique T1552 (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
        - "NIST IA-5 maps to this technique (Center for Threat-Informed Defense, SP 800-53 Rev 5 to ATT&CK 16.1)"
  description: >
    /etc/nslcd.conf sets bindpw or rootpwmodpw, and its owner, group or mode
    lets an account other than root read it. nslcd.conf(5), under both
    options: "If you set this option you should consider changing the
    permissions of the nslcd.conf file to only grant access to the root
    user." Some distributions package the file readable by a group or by
    everyone. The file is judged whether or not the host is wired to nslcd,
    and the password is not recorded.
  impact: >
    A local account that can read the file has the password of the directory
    account nslcd binds as, or of the one that changes passwords for root,
    and can use it against the directory from any system that reaches it.
  resolution: >
    chown root:root and chmod 0600 /etc/nslcd.conf. nslcd was seen to start
    and connect with the file in that mode while running as its own account.
  references:
    - source: NIST
